# Source contracts for the nflverse files this lake ingests.
# Keys and season ranges come from docs/SOURCE_INVENTORY.md; ingest enforces each key on every run.
# Unknown settings are rejected when the catalog loads.
#
# Per dataset:
#   release           nflverse-data release the files live in
#   file              file name; {season} marks one file per season
#   min_season        first season to ingest (required with {season})
#   key               columns that identify a row; must be unique and non-null in the clean layer
#   history           latest (default, clean file only) or all (also keep a raw snapshot of every upstream version
#                     whose rows differ from the one before). Changing all to latest stops new snapshots; the ones
#                     already under raw/<dataset>/ stay until you delete them.
#   reject_null_keys  set aside rows whose key is null or empty instead of failing the run
#   keep_last_by      when a key repeats, keep the row with the highest value of this column
#   max_row_drop      fail if a rebuilt file loses more than this share of rows (default 0.02)
#   max_reject_share  fail if more than this share of rows is set aside (default 0.01)

source:
  repo: nflverse/nflverse-data

datasets:
  # One row per game, played or scheduled. Lines for upcoming games change, so every version is kept.
  schedules:
    release: schedules
    file: games.parquet
    key: [game_id]
    history: all

  pbp:
    release: pbp
    file: "play_by_play_{season}.parquet"
    min_season: 1999
    key: [game_id, play_id]

  # One row per player per game, all positions. From 2001 on, one row per week has no player; those rows are set aside.
  stats_player_week:
    release: stats_player
    file: "stats_player_week_{season}.parquet"
    min_season: 1999
    key: [player_id, game_id]
    reject_null_keys: true

  # One row per team per game. 1999 has one row with no team.
  stats_team_week:
    release: stats_team
    file: "stats_team_week_{season}.parquet"
    min_season: 1999
    key: [team, game_id]
    reject_null_keys: true

  players:
    release: players
    file: players.parquet
    key: [gsis_id]
    history: all

  # Every season before 2016 has hundreds of duplicate rows or more, so ingest starts in 2016.
  # A few rows a season have a null or empty gsis_id; they are set aside.
  weekly_rosters:
    release: weekly_rosters
    file: "roster_weekly_{season}.parquet"
    min_season: 2016
    key: [season, week, game_type, team, gsis_id]
    reject_null_keys: true
    history: all

  # The 2012 file is empty upstream. Players carry a PFR id only.
  snap_counts:
    release: snap_counts
    file: "snap_counts_{season}.parquet"
    min_season: 2013
    key: [game_id, pfr_player_id]

  # The final weekly report per player. 2024 has two rows that repeat a key; the one modified last wins.
  # From 2025 upstream has no timestamp, so every version is kept.
  injuries:
    release: injuries
    file: "injuries_{season}.parquet"
    min_season: 2009
    key: [season, game_type, week, team, gsis_id]
    keep_last_by: date_modified
    history: all

  # Timestamped snapshots, 2025 on. The file itself holds every snapshot, so no raw history is kept.
  # The week-based files for 2001-2024 have no unique key and are not ingested.
  depth_charts:
    release: depth_charts
    file: "depth_charts_{season}.parquet"
    min_season: 2025
    key: [dt, team, pos_id, pos_rank]

  ngs_passing:
    release: nextgen_stats
    file: ngs_passing.parquet
    key: [season, season_type, week, player_gsis_id]

  ngs_rushing:
    release: nextgen_stats
    file: ngs_rushing.parquet
    key: [season, season_type, week, player_gsis_id]

  ngs_receiving:
    release: nextgen_stats
    file: ngs_receiving.parquet
    key: [season, season_type, week, player_gsis_id]

  # Published only after the postseason, so the season in progress has no file.
  pbp_participation:
    release: pbp_participation
    file: "pbp_participation_{season}.parquet"
    min_season: 2016
    key: [nflverse_game_id, play_id]

  ftn_charting:
    release: ftn_charting
    file: "ftn_charting_{season}.parquet"
    min_season: 2022
    key: [nflverse_game_id, nflverse_play_id]

  pfr_week_pass:
    release: pfr_advstats
    file: "advstats_week_pass_{season}.parquet"
    min_season: 2018
    key: [game_id, pfr_player_id]

  pfr_week_rush:
    release: pfr_advstats
    file: "advstats_week_rush_{season}.parquet"
    min_season: 2018
    key: [game_id, pfr_player_id]

  pfr_week_rec:
    release: pfr_advstats
    file: "advstats_week_rec_{season}.parquet"
    min_season: 2018
    key: [game_id, pfr_player_id]

  pfr_week_def:
    release: pfr_advstats
    file: "advstats_week_def_{season}.parquet"
    min_season: 2018
    key: [game_id, pfr_player_id]
