[project]
name = "nfl-data"
version = "0.1.0"
# One Python minor, the one the lockfile is tested on. `.python-version` selects it for uv.
requires-python = ">=3.15,<3.16"
dependencies = [
    # Config
    "pydantic>=2.14,<3",
    "pyyaml>=6.0",
    # Storage and query
    "polars>=2.1,<3",
    "duckdb>=2.0,<3",
    # Time zone database. Windows has none, and polars needs one to return time-zone-aware timestamps.
    "tzdata>=2026.1",
]

[dependency-groups]
dev = [
    "hypothesis>=6.170.17",
    "pytest>=9",
    "ruff>=0.17.6",
]

[tool.ruff]
# `uv run ruff format` owns the layout. `uv run ruff check` looks for mistakes.
line-length = 120

[tool.uv]
# The code is run from the repo root as `python -m nfl_lake`; it is not an installable package.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests import `nfl_lake` from the repo root.
pythonpath = ["."]
