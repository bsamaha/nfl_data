[project]
name = "nfl-data"
version = "0.1.0"
# One Python minor, the one the lockfile is tested on. `.python-version` selects it for uv.
requires-python = ">=3.15,<3.16"
dependencies = [
    # CLI, config, logging
    "typer>=0.29",
    "python-dotenv>=1.2",
    "pydantic>=2.14,<3",
    "pyyaml>=6.0",
    "structlog>=26.1",
    # Storage and query
    "polars>=2.1,<3",
    "pyarrow>=26",
    "duckdb>=2.0,<3",
    # Time zone database. Windows has none, and polars needs one to return time-zone-aware timestamps.
    "tzdata>=2026.1",
]

[dependency-groups]
dev = [
    "pytest>=9",
]

[tool.uv]
# The code is run from the repo root as `python -m nfl_lake`; it is not an installable package.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests import `nfl_lake` from the repo root and the inventory helper from its scripts folder.
pythonpath = [".", "scripts/source_inventory"]
