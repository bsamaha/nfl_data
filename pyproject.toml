[project]
name = "nfl-data"
version = "0.1.0"
description = "Local NFL lakehouse: Parquet files queried with DuckDB"
readme = "README.md"
# One Python minor, the one the lockfile is tested on. `.python-version` selects it for uv.
# 3.15 became possible when step 3 removed nfl_data_py, whose fastparquet dependency had no 3.15 wheel.
requires-python = ">=3.15,<3.16"
dependencies = [
    # CLI, config, logging
    "typer>=0.12",
    "python-dotenv>=1.0",
    "pydantic>=2.5,<3",
    "pyyaml>=6.0",
    "structlog>=24.1",
    # Storage and query
    "polars>=2.1,<3",
    "pyarrow>=15",
    "duckdb>=2.0,<3",
    # Streamlit pages under app/. They also import pandas, which streamlit brings in.
    "streamlit>=1.37",
    "altair>=6,<7",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.uv]
# The code is run from the repo root as `python -m nfl_lake`; it is not an installable package.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests import `nfl_lake.*` and `app.*` from the repo root.
pythonpath = ["."]
